[project]
name = "sample-multi-turn-rl-wordle"
version = "0.1.0"
description = "Train a 20B model to play Wordle with SageMaker Multi-Turn RL and Bedrock AgentCore"
readme = "README.md"
authors = [
    { name = "Daniel Quang", email = "dxq@amazon.com" }
]
requires-python = ">=3.10"
dependencies = [
    "sagemaker-train>=1.21.0",
    "strands-agents>=1.54.0",
]

# Scripts only, nothing to build or install. Without this, `uv run` tries to
# build the project as a package and fails looking for src/<name>/__init__.py.
[tool.uv]
package = false
